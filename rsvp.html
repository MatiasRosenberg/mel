<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Confirmar asistencia - 15 de Melina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="rsvp-page">
  <!--
    Prueba local: en la carpeta email-server creá .env (copiá .env.example), npm install, npm start.
    Abrí esta página con un servidor HTTP (Live Server, no file://). En localhost el JS usa solo http://127.0.0.1:3000/api/rsvp.
    Producción: en CONFIG.apiUrl pegá la URL de tu API en Render, etc.
  -->
  <div class="page-wrapper">
    <div class="page-frame">
      <main class="content">
        <section class="section rsvp-section">
          <h2 class="section-title">Formulario de asistencia</h2>
          <p id="rsvp-error" class="rsvp-error" role="alert" hidden></p>
          <form id="rsvp-form" class="rsvp-form" novalidate>
            <input type="text" id="rsvp-honey" class="rsvp-honey" tabindex="-1" autocomplete="off" aria-hidden="true">

            <label for="rsvp-nombre">Nombre y apellido</label>
            <input id="rsvp-nombre" name="nombre" type="text" required>

            <label for="rsvp-cantidad">Cantidad total de asistentes</label>
            <input id="rsvp-cantidad" name="cantidad" type="number" min="1" required>

            <label for="rsvp-adultos">Adultos</label>
            <input id="rsvp-adultos" name="adultos" type="number" min="0" value="1">

            <label for="rsvp-ninos">Niños</label>
            <input id="rsvp-ninos" name="ninos" type="number" min="0" value="0">

            <label for="rsvp-restricciones">Restricciones alimentarias (opcional)</label>
            <input id="rsvp-restricciones" name="restricciones" type="text" placeholder="Ej: celiaquía, vegetariano">

            <label for="rsvp-mensaje">Mensaje (opcional)</label>
            <textarea id="rsvp-mensaje" name="mensaje" rows="4" placeholder="Dejanos un mensaje"></textarea>

            <button class="action-button" type="submit" id="rsvp-submit">Enviar confirmación</button>
            <a class="action-button" href="index.html">Volver a la invitación</a>
            <p class="rsvp-help">En tu PC: corre <strong>email-server</strong> y abrí esta página por http (Live Server). En internet: API en Render + CONFIG.apiUrl.</p>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script>
    (function () {
      /* apiUrl vacío: en localhost/127.0.0.1 usa solo el servidor local (puerto abajo).
         Para GitHub Pages, pegá la URL de producción, ej. https://xxx.onrender.com/api/rsvp */
      var CONFIG = {
        apiUrl: '',
        localPort: 3000,
        secret: ''
      };

      function resolveApiUrl() {
        var manual = String(CONFIG.apiUrl || '').trim();
        if (manual && /^https?:\/\//i.test(manual)) return manual;
        var h = window.location.hostname;
        if (h === 'localhost' || h === '127.0.0.1') {
          var p = Number(CONFIG.localPort) || 3000;
          return 'http://127.0.0.1:' + p + '/api/rsvp';
        }
        return '';
      }

      var form = document.getElementById('rsvp-form');
      var errEl = document.getElementById('rsvp-error');
      var btn = document.getElementById('rsvp-submit');
      var honey = document.getElementById('rsvp-honey');

      function showError(msg) {
        errEl.textContent = msg || '';
        errEl.hidden = !msg;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        showError('');

        var url = resolveApiUrl();
        if (!url) {
          showError(
            'Falta CONFIG.apiUrl con la URL de tu API (ej. en Render). ' +
            'Si estás probando en tu PC: abrí rsvp.html por http (Live Server), no como archivo, y en otra terminal ejecutá npm start en la carpeta email-server.'
          );
          return;
        }
        if (window.location.protocol === 'file:') {
          showError('No uses archivo local (file://). Abrí el proyecto con Live Server u otro servidor HTTP para probar el envío.');
          return;
        }

        var fd = new FormData(form);
        var payload = {
          nombre: String(fd.get('nombre') || '').trim(),
          cantidad: String(fd.get('cantidad') || '').trim(),
          adultos: String(fd.get('adultos') || '0').trim(),
          ninos: String(fd.get('ninos') || '0').trim(),
          restricciones: String(fd.get('restricciones') || '').trim(),
          mensaje: String(fd.get('mensaje') || '').trim(),
          _honey: honey ? honey.value : ''
        };

        var headers = { 'Content-Type': 'application/json' };
        if (CONFIG.secret) headers['Authorization'] = 'Bearer ' + CONFIG.secret;

        btn.disabled = true;
        var prev = btn.textContent;
        btn.textContent = 'Enviando…';

        fetch(url, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(payload)
        })
          .then(function (res) {
            return res.text().then(function (text) {
              var data = {};
              try {
                data = text ? JSON.parse(text) : {};
              } catch (e) {}
              return { ok: res.ok, data: data };
            });
          })
          .then(function (_ref) {
            if (_ref.ok && _ref.data && _ref.data.ok) {
              window.location.href = new URL('gracias.html', window.location.href).href;
              return;
            }
            var msg = (_ref.data && _ref.data.error) ? _ref.data.error : 'No se pudo enviar. Probá más tarde.';
            showError(msg);
          })
          .catch(function () {
            showError('Error de red. Revisá la URL del servidor o tu conexión.');
          })
          .finally(function () {
            btn.disabled = false;
            btn.textContent = prev;
          });
      });
    })();
  </script>
</body>
</html>
