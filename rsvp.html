<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Confirmar asistencia - 15 de Melina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="rsvp-page">
  <!--
    No existe "JS + SMTP" en el navegador: GitHub Pages no puede enviar mails con tu servidor de correo.
    Este formulario usa FormSubmit: solo reemplazá TU_EMAIL en el action y confirmá el correo la primera vez.
  -->
  <div class="page-wrapper">
    <div class="page-frame">
      <main class="content">
        <section class="section rsvp-section">
          <h2 class="section-title">Formulario de asistencia</h2>
          <form class="rsvp-form" method="POST" action="https://formsubmit.co/1999matute@gmail.com">
            <input type="hidden" name="_subject" value="Confirmación de asistencia - 15 de Melina">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" id="formsubmit-next" value="">
            <input type="text" name="_honey" class="rsvp-honey" tabindex="-1" autocomplete="off" aria-hidden="true">

            <label for="rsvp-nombre">Nombre y apellido</label>
            <input id="rsvp-nombre" name="nombre" type="text" required>

            <label for="rsvp-cantidad">Cantidad total de asistentes</label>
            <input id="rsvp-cantidad" name="cantidad" type="number" min="1" required>

            <label for="rsvp-adultos">Adultos</label>
            <input id="rsvp-adultos" name="adultos" type="number" min="0" value="1">

            <label for="rsvp-ninos">Niños</label>
            <input id="rsvp-ninos" name="ninos" type="number" min="0" value="0">

            <label for="rsvp-restricciones">Restricciones alimentarias (opcional)</label>
            <input id="rsvp-restricciones" name="restricciones" type="text" placeholder="Ej: celiaquía, vegetariano">

            <label for="rsvp-mensaje">Mensaje (opcional)</label>
            <textarea id="rsvp-mensaje" name="mensaje" rows="4" placeholder="Dejanos un mensaje"></textarea>

            <button class="action-button" type="submit">Enviar confirmación</button>
            <a class="action-button" href="index.html">Volver a la invitación</a>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script>
    (function () {
      var el = document.getElementById('formsubmit-next');
      if (el) el.value = new URL('gracias.html', window.location.href).href;
    })();
  </script>
</body>
</html>
