<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Confirmar asistencia - 15 de Melina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="rsvp-page">
  <div class="page-wrapper">
    <div class="page-frame">
      <div class="frame-bg" aria-hidden="true"></div>
      <main class="content">
        <section class="section rsvp-section">
          <h2 class="section-title">Formulario de asistencia</h2>
          <p id="rsvp-status" class="rsvp-error" role="alert" hidden></p>
          <form id="rsvp-form" class="rsvp-form" novalidate>
            <input type="text" name="_honey" class="rsvp-honey" tabindex="-1" autocomplete="off" aria-hidden="true">

            <label for="rsvp-nombre">Nombre y apellido</label>
            <input id="rsvp-nombre" name="nombre" type="text" required>

            <label for="rsvp-cantidad">Cantidad total de asistentes</label>
            <input id="rsvp-cantidad" name="cantidad" type="number" min="1" required>

            <label for="rsvp-adultos">Adultos</label>
            <input id="rsvp-adultos" name="adultos" type="number" min="0" value="1">

            <label for="rsvp-ninos">Niños</label>
            <input id="rsvp-ninos" name="ninos" type="number" min="0" value="0">

            <label for="rsvp-restricciones">Restricciones alimentarias (opcional)</label>
            <input id="rsvp-restricciones" name="restricciones" type="text" placeholder="Ej: celiaquía, vegetariano">

            <label for="rsvp-mensaje">Mensaje (opcional)</label>
            <textarea id="rsvp-mensaje" name="mensaje" rows="4" placeholder="Dejanos un mensaje"></textarea>

            <button class="action-button" type="submit" id="rsvp-btn">Enviar confirmación</button>
            <a class="action-button" href="index.html">Volver a la invitación</a>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script>
    (function () {
      var MAILTO = 'yami.rosenberg@hotmail.com';
      var AJAX_URL = 'https://formsubmit.co/ajax/' + MAILTO;

      var form = document.getElementById('rsvp-form');
      var btn = document.getElementById('rsvp-btn');
      var status = document.getElementById('rsvp-status');

      function msg(txt, isError) {
        status.textContent = txt;
        status.hidden = !txt;
        status.className = isError ? 'rsvp-error' : 'rsvp-ok';
      }

      function buildMailto(fd) {
        var sub = encodeURIComponent('Confirmación de asistencia - 15 de Melina');
        var body = encodeURIComponent(
          'Confirmo asistencia para los 15 de Melina.\n\n' +
          'Nombre: ' + (fd.get('nombre') || '') + '\n' +
          'Cantidad total: ' + (fd.get('cantidad') || '') + '\n' +
          'Adultos: ' + (fd.get('adultos') || '0') + '\n' +
          'Niños: ' + (fd.get('ninos') || '0') + '\n' +
          'Restricciones: ' + (fd.get('restricciones') || 'Ninguna') + '\n' +
          'Mensaje: ' + (fd.get('mensaje') || 'Sin mensaje') + '\n'
        );
        return 'mailto:' + MAILTO + '?subject=' + sub + '&body=' + body;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        msg('');

        var nombre = (form.elements.nombre.value || '').trim();
        var cantidad = (form.elements.cantidad.value || '').trim();
        if (!nombre || !cantidad) {
          msg('Completá nombre y cantidad de asistentes.', true);
          return;
        }

        var fd = new FormData(form);
        fd.append('_subject', 'Confirmación de asistencia - 15 de Melina');
        fd.append('_template', 'table');
        fd.append('_captcha', 'false');

        btn.disabled = true;
        var prev = btn.textContent;
        btn.textContent = 'Enviando…';

        var timeout = setTimeout(function () { ctrl.abort(); }, 12000);
        var ctrl = new AbortController();

        fetch(AJAX_URL, {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: fd,
          signal: ctrl.signal
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            clearTimeout(timeout);
            if (data && data.success) {
              window.location.href = new URL('gracias.html', window.location.href).href;
            } else {
              throw new Error('no-success');
            }
          })
          .catch(function () {
            clearTimeout(timeout);
            var link = buildMailto(fd);
            status.innerHTML =
              'No se pudo conectar con el servicio. ' +
              '<a href="' + link + '" style="color:#1e4578;font-weight:600;">Tocá acá para enviar por email</a> ' +
              '(se abre tu app de correo con los datos ya cargados).';
            status.hidden = false;
            status.className = 'rsvp-error';
          })
          .finally(function () {
            btn.disabled = false;
            btn.textContent = prev;
          });
      });
    })();
  </script>
</body>
</html>
